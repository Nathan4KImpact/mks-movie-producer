<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKS Movie Producer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b10; --panel:#16131b; --panel2:#1d1924; --line:#2c2634; --text:#ece6da; --muted:#a39a8c;
  --gold:#d8b46a; --gold2:#f0d491; --red:#d0614f; --green:#6fbf8a; --blue:#7aa6d8;
  --r:10px; --serif:'Cinzel',Georgia,serif; --sans:'Inter',system-ui,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#2a1f14 0%,var(--bg) 60%) fixed;color:var(--text);font:14px/1.5 var(--sans)}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,11,16,.92);backdrop-filter:blur(8px);z-index:10}
header h1{font:700 19px var(--serif);letter-spacing:.08em;margin:0;color:var(--gold2);text-transform:uppercase;white-space:nowrap}
.appli{font:600 9.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.marque{display:flex;gap:12px;align-items:center;cursor:pointer}.marque img{width:46px;height:46px;object-fit:contain}.marque .meta{font-size:11px;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--muted);font:500 14px var(--sans);padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on,nav button:hover{color:var(--text);background:var(--panel2)}
.sp{flex:1}
main{padding:24px;max-width:1500px;margin:0 auto}
h2{font:700 22px var(--serif);letter-spacing:.05em;color:var(--gold2);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font:500 13px var(--sans);white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1408;border:0;font-weight:600}
.btn.ia{border-color:#4a3d6a;background:#221b33}
.btn.small{padding:4px 9px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{font:700 15px var(--serif);margin:0;letter-spacing:.04em}
.card .id{color:var(--gold);font:600 12px var(--sans);letter-spacing:.1em}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--panel2);color:var(--muted)}
.pill.ok{background:#1d3326;color:var(--green)}.pill.wait{background:#3a2a17;color:var(--gold2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:16px;position:sticky;top:62px;z-index:5}
.shot{display:grid;grid-template-columns:44px 260px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.shot.cardrow{grid-template-columns:44px 1fr;background:#120f16;border-style:dashed}
.num{font:700 13px var(--serif);color:var(--gold);text-align:center;padding-top:4px}
.thumb{width:260px;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb .tag{position:absolute;top:6px;left:6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.fields .full{grid-column:1/-1}
label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
textarea,input,select{width:100%;background:#0f0d13;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 9px;font:13px/1.45 var(--sans);resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--gold)}
textarea.vo{min-height:64px;font-size:14px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dirty{box-shadow:0 0 0 1px var(--gold) inset}
.tr label{color:var(--blue)} .tr textarea,.tr input{border-color:#2b3a4f;background:#141a24}
.pill.lang{background:#1b2636;color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
#jobs{position:fixed;right:16px;bottom:16px;width:min(560px,calc(100vw - 32px));z-index:20}
.job{background:#0b0a0e;border:1px solid var(--line);border-radius:var(--r);margin-top:8px;overflow:hidden}
.job .hd{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);cursor:pointer}
.job pre{margin:0;max-height:220px;overflow:auto;padding:8px 12px;font:12px/1.4 ui-monospace,Consolas,monospace;color:#cfc6b8;white-space:pre-wrap}
.job.min pre{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:30}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(900px,94vw);max-height:88vh;overflow:auto;padding:20px}
.prompt{background:#0f0d13;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;font-size:12.5px}
.prompt .k{color:var(--gold);font-weight:600}
video.player{width:100%;border-radius:10px;background:#000}
.list a{color:var(--gold2)}
.warn{color:var(--gold2)} .err{color:var(--red)} .okc{color:var(--green)}
@media (max-width:900px){.shot{grid-template-columns:1fr}.thumb{width:100%}.fields{grid-template-columns:1fr}.mini{grid-template-columns:1fr 1fr}}
.guide{display:flex;gap:14px;align-items:center;margin:0 auto;max-width:1500px;padding:12px 24px 0}
.guide .in{flex:1;display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,#2a2112,#16131b);border:1px solid #4a3a1c;border-radius:var(--r);padding:10px 14px}
.guide .pin{font:700 12px var(--sans);color:#1b1408;background:var(--gold);border-radius:99px;padding:3px 10px;white-space:nowrap}
.guide b{color:var(--gold2)}
.steps{display:flex;gap:4px;margin:6px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--panel2)}
.steps i.on{background:var(--gold)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.md{max-width:1000px;line-height:1.65}
.md h1{font:700 26px var(--serif);color:var(--gold2)} .md h2{font:700 20px var(--serif);color:var(--gold2);margin-top:32px;border-bottom:1px solid var(--line);padding-bottom:6px} .md h3{font:700 16px var(--serif);color:var(--gold);margin-top:22px}
.md table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px} .md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top} .md th{background:var(--panel2);color:var(--gold2)}
.md code{background:#0f0d13;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px} .md pre{background:#0f0d13;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap}
.md h2,.md h3{scroll-margin-top:170px}
.md img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:8px 0;display:block}
.md blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--gold);background:var(--panel);border-radius:0 8px 8px 0;color:var(--text)}
.md a{color:var(--gold2)} .md hr{border:0;border-top:1px solid var(--line);margin:24px 0} .md ol,.md ul{padding-left:22px}
@media (max-width:900px){.md.aide{grid-column:1/-1}}
table.org{border-collapse:collapse;width:100%;margin-top:6px;font-size:13px}
table.org th{text-align:left;color:var(--muted);font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.org td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.org code{background:#0f0d13;border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;font:500 13px var(--sans)}
.tabs button.on{color:#1b1408;background:var(--gold);border-color:var(--gold)}
.ep{display:grid;grid-template-columns:60px 1fr 210px;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.ep .n{font:700 18px var(--serif);color:var(--gold)}
.ep .r{color:var(--muted);font-size:13px}
.prof{display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.4fr 1.6fr auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:900px){.ep{grid-template-columns:1fr}.prof{grid-template-columns:1fr 1fr}}
.rendu{padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;flex-direction:column;border:1px solid transparent}
.rendu:hover{background:var(--panel2)} .rendu.on{background:#2a2112;border-color:#4a3a1c;color:var(--gold2)}
@media (max-width:1100px){#main > div[style*="260px 1fr 330px"]{grid-template-columns:1fr !important}}
</style>
</head>
<body>
<header>
  <div class="marque" onclick="go('projet')" title="Projet en cours — cliquer pour changer">
    <img id="logo" src="/api/logo" alt="">
    <div><div class="appli">MKS Movie Producer</div><h1 id="nomProjet">…</h1><div id="sousProjet" class="meta"></div></div>
  </div>
  <nav>
    <button data-v="assistant" class="on">Assistant</button>
    <button data-v="saison">Production</button>
    <button data-v="plan">Plan</button>
    <button data-v="bible">Bible</button>
    <button data-v="rendus">Rendus</button>
    <button data-v="nouveau">Nouvel épisode</button>
    <button data-v="projet">Projet</button>
    <button data-v="reglages">Réglages</button>
    <button data-v="aide">Aide</button>
  </nav>
  <div class="sp"></div>
  <button class="btn small" onclick="ouvrir('rendus')">Dossier Rendus</button>
  <button class="btn small" onclick="ouvrir('flow')">Dossier Flow</button>
</header>
<div class="guide" id="guide"></div>
<main id="main"></main>
<div id="jobs"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const api = async (u, o={}) => { const r = await fetch(u, {headers:{'Content-Type':'application/json'}, ...o}); const j = await r.json(); if(!r.ok) throw new Error(j.erreur||r.status); return j; };
const win = p => (p||'').replace(/\//g, '\\');
const esc = s => (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CONFIG = null, PROJET = null, INFOS = null, EP = null, DIRTY = false;
let LANGS = {source:'fr', versions:{}, noms:{}, voix:{}, voix_defaut:{}}, VL = '', RETOUCHE = new Set();
const LN = c => LANGS.noms[(c||'').split('-')[0]] || c;
const VERS = () => Object.keys(LANGS.versions||{});
const STR = {ok:'<span class="pill ok">traduit</span>', manquante:'<span class="pill">à traduire</span>', a_revoir:'<span class="pill wait">à revoir</span>', rien:''};
const chemin = f => f.split('/').map(encodeURIComponent).join('/');
function langueAffichee(){ let l = ''; try { l = localStorage.getItem('ua_lang')||''; } catch(e){} return VERS().includes(l) ? l : ''; }
function choisirVL(l){ if(DIRTY) lireForm(); try { localStorage.setItem('ua_lang', l); } catch(e){} const d = DIRTY; episode(EP._ep, d ? EP : null).then(()=>{ if(d) marquerSale(); }); }
const EXTRAITS = {fr:"Ce que je vais vous raconter, je l'ai vu. Une armée immense s'avançait, et la montagne tremblait sous ses pas.",
  en:"What I am about to tell you, I saw. A vast army was advancing, and the mountain trembled beneath its feet.",
  es:"Lo que voy a contarles, lo vi. Un ejército inmenso avanzaba, y la montaña temblaba bajo sus pasos.",
  de:"Was ich euch erzählen werde, habe ich gesehen. Ein gewaltiges Heer rückte vor, und der Berg bebte unter seinen Schritten.",
  pt:"O que vou contar, eu vi. Um exército imenso avançava, e a montanha tremia sob os seus passos.",
  it:"Ciò che sto per raccontarvi, l'ho visto. Un esercito immenso avanzava, e la montagna tremava sotto i suoi passi."};
async function ecouter(nom, debit, hauteur, langue){
  toast('Préparation de l\'extrait…');
  try { const r = await api('/api/voix/essai',{method:'POST',body:JSON.stringify({nom, debit, hauteur, texte: EXTRAITS[(langue||'').split('-')[0]] || EXTRAITS.en})});
    new Audio(r.url).play(); } catch(e){ toast(e.message); } }
const MOUV = ['in','out','left','right','up','down','still'];

document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v, arg){ if(DIRTY && !confirm('Modifications non enregistrées. Quitter quand même ?')) return; DIRTY=false; $('#main').oninput = null;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  ({assistant, saison, plan, bible, rendus, nouveau, reglages, episode, projet, aide})[v](arg); location.hash = v + (arg?'/'+arg:''); guide(); }
async function ouvrir(d){ await api('/api/ouvrir',{method:'POST',body:JSON.stringify({dossier:d})}); }

// ---------------------------------------------------------------- saison
async function saison(){
  const eps = await api('/api/episodes');
  $('#main').innerHTML = `<h2>Production</h2><p class="sub">${eps.length} épisode(s) écrit(s). État de chaque épisode. Clique sur un épisode pour l'éditer, générer sa fiche Flow ou le monter.</p>
  <div class="grid">${eps.map(e => e.erreur ? `<div class="card"><h3>${e.ep}</h3><span class="err">${esc(e.erreur)}</span></div>` : `
    <div class="card">
      <div class="row"><span class="id">${esc(e.id)}</span><div class="sp"></div>${e.rendus.length?'<span class="pill ok">monté</span>':(e.medias===e.plans?'<span class="pill wait">prêt à monter</span>':'<span class="pill">en préparation</span>')}</div>
      <h3>${esc(e.title)}</h3>
      <div class="bar"><i style="width:${Math.round(100*e.medias/Math.max(1,e.plans))}%"></i></div>
      <div class="meta"><span>${e.medias}/${e.plans} images</span><span>${e.videos} vidéos</span><span>~${e.minutes} min</span><span>${e.rendus.length} rendu(s)</span></div>
      <div class="row"><button class="btn gold" onclick="go('episode','${e.ep}')">Ouvrir</button>
        <button class="btn" onclick="action('monter',['${e.ep}'])">Monter</button>
        <button class="btn" onclick="fiche('${e.ep}')">Fiche Flow</button></div>
      ${Object.entries(e.traductions||{}).map(([l,t])=>`<div class="row" style="gap:6px;flex-wrap:nowrap;border-top:1px solid var(--line);padding-top:8px">
        <span class="pill ${t.complete?'ok':(t.a_revoir?'wait':'lang')}" title="${esc(LN(l))}">${l.toUpperCase()} · ${t.ok}/${t.total}${t.a_revoir?' · '+t.a_revoir+' à revoir':''}</span>
        ${t.rendus.length?`<span class="meta" style="white-space:nowrap">${t.rendus.length} rendu(s)</span>`:''}<div class="sp"></div>
        <button class="btn small" onclick="action('traduire',['${e.ep}','${l}'])">${t.complete?'Retraduire':'Traduire'}</button>
        <button class="btn small" ${t.manquantes?'disabled title="Traduction incomplète"':''} onclick="action('monter',['${e.ep}','--langue','${l}'])">Monter ${l.toUpperCase()}</button></div>`).join('')}
    </div>`).join('')}</div>`;
}

// ---------------------------------------------------------------- épisode
async function episode(ep, garder){
  EP = garder || await api('/api/episode/'+ep); EP._ep = ep;
  await chargerProjet(); VL = langueAffichee(); RETOUCHE = new Set();
  const trv = (el, i, champ, lib, zone) => { const t = (el.versions||{})[VL]||{};
    return zone ? `<div class="full tr"><label>${lib} (${VL.toUpperCase()}) ${STR[(el._tr||{})[VL]]||''}</label><textarea class="vo" data-l="${champ}" rows="3">${esc(t[champ])}</textarea></div>`
                : `<div class="tr"><label>${lib} (${VL.toUpperCase()})</label><input data-l="${champ}" value="${esc(t[champ])}"></div>`; };
  const mus = ['', ...(PROJET.musiques||[])];
  let n = 0;
  $('#main').innerHTML = `
  <h2>${esc(EP.id)} — <input id="titre" value="${esc(EP.title)}" style="display:inline;width:auto;min-width:380px;font:700 20px var(--serif);background:none;border:0;color:var(--gold2)"></h2>
  ${VL?`<div class="tr" data-i="e" style="max-width:640px;margin:4px 0 8px"><label>Titre (${VL.toUpperCase()}) ${STR[(EP._tr||{})[VL]]||''}</label><input data-l="title" value="${esc(((EP.versions||{})[VL]||{}).title)}"></div>`:''}
  <p class="sub">${EP.shots.filter(s=>!s.card).length} plans · les images se rangent dans ${esc(win(INFOS.dossiers.images))}\\${ep}\\ sous leur clé (ex. ${ep}-01.png)</p>
  <div class="toolbar">
    <button class="btn gold" onclick="sauver()">Enregistrer</button>
    <button class="btn" onclick="sauver().then(()=>action('monter',['${ep}']))">Enregistrer et monter</button>
    <label style="margin:0;text-transform:none;letter-spacing:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="neuf" style="width:auto"> depuis zéro</label>
    <button class="btn" onclick="fiche('${ep}')">Fiche Flow</button>
    <button class="btn" onclick="recharger()">Rafraîchir les images</button>
    <div class="sp"></div>
    <button class="btn ia" onclick="sauver().then(()=>action('prompts',['${ep}', prompt('Consignes pour la réécriture des prompts (facultatif) :')||'']))">IA · réécrire les prompts</button>
    <button class="btn ia" onclick="action('verifier',['${ep}'])">IA · relire les images</button>
  </div>
  ${VERS().length?`<div class="toolbar">
    <label style="margin:0">Version linguistique</label>
    <select id="vl" style="width:auto" onchange="choisirVL(this.value)"><option value="">— texte d'origine seul (${esc(LN(LANGS.source))})</option>${VERS().map(l=>`<option value="${l}" ${l===VL?'selected':''}>${esc(LN(l))} (${l.toUpperCase()}) côte à côte</option>`).join('')}</select>
    ${VL?`<button class="btn ia" onclick="sauver().then(()=>action('traduire',['${ep}','${VL}', prompt('Consignes pour la traduction (facultatif) :')||'']))">IA · traduire en ${VL.toUpperCase()}</button>
    <button class="btn" onclick="sauver().then(()=>action('monter',['${ep}','--langue','${VL}']))">Enregistrer et monter ${VL.toUpperCase()}</button>
    <span class="meta">Seuls les plans à traduire ou à revoir partent à l'IA. Une correction à la main compte comme validée.</span>`:''}
  </div>`:''}
  <div id="shots">${EP.shots.map((s,i)=> s.card ? `
    <div class="shot cardrow" data-i="${i}"><div class="num">◆</div>
      <div class="fields"><div><label>Carton</label><input data-f="card" value="${esc(s.card)}"></div>
      <div><label>Sous-titre</label><input data-f="sub" value="${esc(s.sub)}"></div>
      <div><label>Durée (s)</label><input data-f="dur" type="number" value="${s.dur??6}"></div>
      ${VL?`${trv(s,i,'card','Carton')}${trv(s,i,'sub','Sous-titre')}<div class="tr"><label>&nbsp;</label>${STR[(s._tr||{})[VL]]||''}</div>`:''}</div></div>` : `
    <div class="shot" data-i="${i}">
      <div class="num">${++n}<br><span style="font:11px var(--sans);color:var(--muted)">${esc(s.k)}</span></div>
      <div><div class="thumb">${s._media ? (s._type==='video' ? `<video src="${s._media}" muted loop onmouseenter="this.play()" onmouseleave="this.pause()"></video><span class="pill ok tag">vidéo</span>` : `<img loading="lazy" src="${s._media}">`) : `image manquante<br>${esc(s.k)}.png`}</div>
        <div class="row" style="margin-top:6px"><button class="btn small" onclick="copier(${i})">Copier le prompt</button></div></div>
      <div class="fields">
        <div class="full"><label>Narration</label><textarea class="vo" data-f="vo">${esc(s.vo)}</textarea></div>
        ${VL?trv(s,i,'vo','Narration',true)+(s.title||((s.versions||{})[VL]||{}).title?trv(s,i,'title','Titre à l\'écran'):''):''}
        <div class="full"><label>Prompt image ${(PROJET.personnages||[]).filter(x=>(s.p||'').includes('['+x.tag+']')).map(x=>`<span class="pill wait">${esc(x.tag)}</span>`).join(' ')}</label><textarea data-f="p" rows="2">${esc(s.p)}</textarea></div>
        <div class="full mini">
          <div><label>Mouvement</label><select data-f="m">${MOUV.map(m=>`<option ${m===(s.m||'in')?'selected':''}>${m}</option>`).join('')}</select></div>
          <div><label>Titre à l'écran</label><input data-f="title" value="${esc(s.title)}"></div>

function lireForm(){

      const f = el.dataset.f; let v = el.value;
      if(['min','dur'].includes(f)){ if(v==='') { delete s[f]; return; } v = +v; }
      if(v==='' && f!=='vo') delete s[f]; else s[f] = v;
    });
  });
  if(VL) document.querySelectorAll('[data-i]').forEach(row => {          // traductions corrigées à la main
    if(!RETOUCHE.has(row.dataset.i)) return;

    row.querySelectorAll('[data-l]').forEach(x => { t[x.dataset.l] = x.value; });
    el._retouche = [...new Set([...(el._retouche||[]), VL])];
  });

// ---------------------------------------------------------------- bible
const ancre = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function md2html(t){
  const inl = x => esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy">')
    .replace(/\[([^\]]+)\]\((#[^)\s]+)\)/g,'<a href="javascript:void(0)" onclick="document.getElementById(\'$2\'.slice(1))?.scrollIntoView({behavior:\'smooth\'})">$1</a>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const L = t.split('\n'); let h = '', i = 0;
  while(i < L.length){ const l = L[i];
    if(l.startsWith('```')){ let c=[]; i++; while(i<L.length && !L[i].startsWith('```')) c.push(L[i++]); h += `<pre>${esc(c.join('\n'))}</pre>`; i++; continue; }
    const m = l.match(/^(#{1,4}) (.*)/); if(m){ const id = ancre(m[2]); h += `<h${m[1].length} id="${id}">${inl(m[2])}</h${m[1].length}>`; i++; continue; }
    if(l.startsWith('|')){ const rows=[]; while(i<L.length && L[i].startsWith('|')) rows.push(L[i++]);
      const cells = r => r.slice(1,-1).split(' | ').map(c=>c.trim()); const hd = cells(rows[0]);
      h += `<table><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join('')}</tr>${rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</table>`; continue; }
    if(l.startsWith('>')){ const q=[]; while(i<L.length && L[i].startsWith('>')) q.push(L[i++].replace(/^>\s?/,'')); h += `<blockquote>${q.map(inl).join('<br>')}</blockquote>`; continue; }
    if(/^\s*([-*]|\d+\.) /.test(l)){ const num = /^\s*\d+\. /.test(l), items=[]; while(i<L.length && /^\s*([-*]|\d+\.) /.test(L[i])) items.push(L[i++].replace(/^\s*([-*]|\d+\.) /,''));
      h += `<${num?'ol':'ul'}>${items.map(x=>`<li>${inl(x)}</li>`).join('')}</${num?'ol':'ul'}>`; continue; }
    if(/^---+$/.test(l.trim())){ h += '<hr>'; i++; continue; }
    if(l.trim()) h += `<p>${inl(l)}</p>`; i++; }
  return h;
}

async function ouvrirProjet(c, init){
  const r = await api('/api/projet/ouvrir',{method:'POST',body:JSON.stringify({chemin:c, initialiser:!!init})});
  if(r.a_initialiser){ if(confirm('Ce dossier n\'est pas encore un projet. L\'initialiser comme projet (création de projet.json) ?')) return ouvrirProjet(c, true); return; }
  toast('Projet ouvert'); await chargerProjet(); go('assistant');
}
async function oublier(c){ if(!confirm('Retirer ce projet de la liste ? (aucun fichier supprimé)')) return; await api('/api/projet/oublier',{method:'POST',body:JSON.stringify({chemin:c})}); projet(); }
async function choisirDossier(cb, titre, depart){
  const m = document.createElement('div'); m.className='modal'; document.body.appendChild(m);
  async function vue(ch){ const r = await api('/api/parcourir?chemin='+encodeURIComponent(ch||''));
    m.innerHTML = `<div class="box"><h2>${esc(titre)}</h2>
      <div class="row"><input id="dossierSaisi" value="${esc(r.chemin)}" placeholder="Coller un chemin, ex. D:\\Projets\\MaSerie"><button class="btn small" onclick="this.closest('.modal')._vue($('#dossierSaisi').value)">Aller</button></div>
      ${r.est_projet?'<p class="okc">Ce dossier contient un projet.</p>':''}
      <div style="max-height:50vh;overflow:auto;margin:10px 0">${r.parent!==undefined&&r.chemin?`<div class="rendu" onclick="this.closest('.modal')._vue('${esc((r.parent||'').replace(/\\/g,'\\\\'))}')">⬆ Dossier parent</div>`:''}
        ${r.dossiers.map(d=>`<div class="rendu" onclick="this.closest('.modal')._vue('${esc(d.replace(/\\/g,'\\\\'))}')">📁 ${esc(d.split(/[\\/]/).filter(Boolean).pop()||d)}</div>`).join('')}</div>
      <div class="row"><button class="btn gold" onclick="this.closest('.modal')._ok($('#dossierSaisi').value)">Choisir ce dossier</button><button class="btn" onclick="this.closest('.modal').remove()">Annuler</button></div></div>`; }
  m._vue = vue; m._ok = c => { m.remove(); cb(c); }; vue(depart||INFOS?.racine||'');
}
async function nouveauProjet(){
  modal(`<h2>Nouveau projet</h2><p class="sub">Même logiciel, nouvelles données : un dossier de projet est créé avec sa structure, son logo et son plan vide. Ajoute ensuite les sources, puis l'Assistant te guide.</p>
   <div class="fields">
    <div><label>Nom du projet</label><input id="n_nom" placeholder="Ex. Les Actes des Apôtres"></div>
    <div><label>Sous-titre</label><input id="n_sous" placeholder="Mini-série · d'après …"></div>
    <div class="full"><label>Créer dans le dossier</label><div class="row" style="flex-wrap:nowrap"><input id="n_parent" value="${esc((INFOS.racine||'').replace(/[\\/][^\\/]*$/,''))}"><button class="btn small" onclick="choisirDossier(c=>$('#n_parent').value=c,'Dossier parent du nouveau projet',$('#n_parent').value)">Parcourir…</button></div></div>
    <div class="mini full"><div><label>Saisons</label><input id="n_s" type="number" value="1" min="1"></div><div><label>Épisodes / saison</label><input id="n_e" type="number" value="7" min="1"></div>
      <div><label>Durée (min)</label><input id="n_d" type="number" value="7" min="1"></div><div><label>Couleur</label><input id="n_c" type="color" value="#d8b46a" style="height:36px;padding:2px"></div></div>
    <div><label>Voix</label><input id="n_v" value="fr-FR-HenriNeural" list="voixListe2"><datalist id="voixListe2"><option>fr-FR-HenriNeural</option><option>fr-FR-DeniseNeural</option><option>fr-FR-RemyMultilingualNeural</option><option>en-US-GuyNeural</option></datalist></div>
    <div><label>Narrateur (facultatif)</label><input id="n_nar" placeholder="Ex. Le Voyant, Luc l'évangéliste…"></div>
    <div class="full"><label>Style visuel (anglais)</label><textarea id="n_sty" rows="2">Cinematic film still, photorealistic, vivid colors, dramatic lighting, high detail, 16:9, no text. </textarea></div>
    <div class="full"><label>Règles de la série pour l'IA (ton, public, narration)</label><textarea id="n_reg" rows="3" placeholder="Ex. Tu es scénariste de … Ton : … Narration à la première personne par …"></textarea></div>
   </div><div class="row" style="margin-top:10px"><button class="btn gold" onclick="creerProjet()">Créer le projet</button></div>`);
}
async function creerProjet(){
  const d = {nom:$('#n_nom').value.trim(), sous_titre:$('#n_sous').value.trim(), parent:$('#n_parent').value.trim(),
    saisons:$('#n_s').value, episodes_par_saison:$('#n_e').value, duree_min:$('#n_d').value, couleur:$('#n_c').value,
    voix:$('#n_v').value.trim(), narrateur:$('#n_nar').value.trim(), style_image:$('#n_sty').value, regles_ia:$('#n_reg').value};
  if(!d.nom) return toast('Donne un nom au projet');
  try { await api('/api/projet/nouveau',{method:'POST',body:JSON.stringify(d)}); document.querySelectorAll('.modal').forEach(m=>m.remove()); toast('Projet créé'); await chargerProjet(); go('projet'); }
  catch(e){ toast(e.message); }
}

// ---------------------------------------------------------------- tâches
const NOMS = {monter:'Montage', etat:'Vérification', fiche:'Fiche', ecrire:'IA · écriture', prompts:'IA · prompts', verifier:'IA · relecture images', bible:'IA · bible et plan', exporter:'Export du projet', traduire:'IA · traduction'};
async function action(cmd, args){
  if(cmd==='monter' && $('#neuf')?.checked) args = [...args, '--neuf'];
  if(cmd==='ecrire' && (!args[0]||!args[1]||!args[2])) return toast('Code, titre et pages sont nécessaires');
  const lang = cmd==='traduire' ? args[1] : (args.includes('--langue') ? args[args.indexOf('--langue')+1] : '');
  const j = await api('/api/action', {method:'POST', body:JSON.stringify({cmd, args})}); suivre(j.id, `${NOMS[cmd]} ${args[0]||''}${lang?' · '+lang.toUpperCase():''}`);
}
function suivre(id, titre){
  const el = document.createElement('div'); el.className = 'job';
  el.innerHTML = `<div class="hd"><b>${esc(titre)}</b><span class="pill wait">en cours</span><div class="sp"></div><span class="meta">▾</span></div><pre></pre>`;
  el.querySelector('.hd').onclick = () => el.classList.toggle('min');
  $('#jobs').appendChild(el);
  const t = setInterval(async () => {
    const j = await api('/api/job/'+id); const pre = el.querySelector('pre');
    pre.textContent = j.log.split('\n').slice(-60).join('\n'); pre.scrollTop = pre.scrollHeight;
    if(j.etat !== 'en cours'){ clearInterval(t); const p = el.querySelector('.pill'); p.textContent = j.etat; p.className = 'pill ' + (j.etat==='terminé'?'ok':'');
      if(j.etat==='terminé'){ toast(titre + ' : terminé'); setTimeout(()=>el.classList.add('min'), 4000); if(location.hash.startsWith('#saison')||!location.hash) saison();
        else if(location.hash.startsWith('#episode/') && EP && !DIRTY && ['traduire','prompts'].includes(j.cmd)) episode(EP._ep); } }
  }, 1500);
}
function modal(html){ const m = document.createElement('div'); m.className='modal'; m.innerHTML = `<div class="box">${html}<div class="row" style="margin-top:14px"><button class="btn" onclick="this.closest('.modal').remove()">Fermer</button></div></div>`; m.onclick = e => { if(e.target===m) m.remove(); }; document.body.appendChild(m); }
function toast(t){ const d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--gold);color:#1b1408;padding:8px 16px;border-radius:8px;font-weight:600;z-index:40'; document.body.appendChild(d); setTimeout(()=>d.remove(), 2200); }
window.onbeforeunload = () => DIRTY ? true : undefined;

// démarrage
const [v, a] = (location.hash.slice(1)||'assistant').split('/'); chargerProjet().then(()=>go(['assistant','saison','plan','bible','rendus','nouveau','reglages','episode','projet','aide'].includes(v)?v:'assistant', a));
</script>
</body>
</html>
